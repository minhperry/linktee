name: Deploy React App to VPS

on:
  push:
    branches:
      - mainster   # Only trigger on push to the main branch
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - '.editorconfig'

jobs:
  deps-build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.11.0'  # Use the appropriate Node.js version for your project

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript and Vite app
        run: npm run build  # This runs your custom build script: tsc -b && vite build

      - name: Rsync deployments
        uses: burnett01/rsync-deployments@7.0.2
        with:
          switches: -avzr --delete-before
          path: ./dist/  # Vite outputs the build to the `dist/` directory
          remote_path: /var/www/link
          remote_host: ${{ secrets.VPS_IP }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.SSH_KEY }}
